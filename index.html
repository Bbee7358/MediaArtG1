<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuro Brain Visualization</title>
<style>
  :root {
    --brain-width: 50vw;
    --figure-width: 50vw;
    --projection-gap: 28px;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  #glcanvas {
    display: block; position: fixed; left: 0; top: 0; bottom: 0;
    width: calc(var(--brain-width) - var(--projection-gap)); height: 100vh;
    background: #04060d;
  }

  /* 手前の2Dポップアップ・レイヤー */
  #popupLayer {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: calc(var(--brain-width) - var(--projection-gap)); pointer-events: none; z-index: 10; overflow: hidden;
  }
  /* レトロOS（Windows 95/98 風）のウィンドウ。灰色＋ベベル枠 */
  .popup {
    position: absolute;
    background: #c0c0c0;
    padding: 2px;
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;  /* 外側ベベル */
    box-shadow: 1px 1px 0 #000, inset 1px 1px 0 #fff, 3px 3px 10px rgba(0,0,0,0.55);
    font-family: "MS Sans Serif", Tahoma, Geneva, "Hiragino Kaku Gothic ProN", sans-serif;
    opacity: 1;
  }

  /* タイトルバー（青のグラデ＋白文字＋レトロなボタン） */
  .popup .titlebar {
    height: 18px; display: flex; align-items: center; gap: 3px; padding: 0 2px 0 3px;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font: bold 11px/18px "MS Sans Serif", Tahoma, sans-serif;
  }
  .popup .titlebar .tico {
    width: 12px; height: 12px; flex: 0 0 auto;
    background: linear-gradient(135deg, #fff 45%, #7f7f7f 55%), #c0c0c0; border: 1px solid #fff;
  }
  .popup .titlebar .ttext { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .popup .titlebar .tbtn {
    width: 15px; height: 13px; flex: 0 0 auto;
    background: #c0c0c0; border: 1px solid; border-color: #fff #404040 #404040 #fff;
    color: #000; font: bold 9px/11px "MS Sans Serif", Tahoma, sans-serif; text-align: center;
  }

  /* アドレス欄＝貼り付けた画像のソース（web URL / PC パス）。レトロな沈み込み枠 */
  .popup .srcbar {
    height: 16px; line-height: 16px; margin: 2px 1px 1px; padding: 0 4px;
    background: #fff; border: 1px solid; border-color: #808080 #fff #fff #808080;
    font: 11px/16px "MS Sans Serif", Tahoma, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #000;
  }
  .popup .srcbar.web { color: #0000cc; text-decoration: underline; }
  .popup .srcbar.pc  { color: #000; }

  .popup .body {
    position: relative; overflow: hidden; margin: 1px; background: #fff;
    border: 1px solid; border-color: #808080 #fff #fff #808080;
  }
  .popup img, .popup video { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* 画像が読み込めないとき＝「壊れた画像」表示を再現（[not found]） */
  .popup .broken {
    width: 100%; height: 100%; box-sizing: border-box; padding: 8px 9px;
    display: flex; align-items: center; gap: 8px;
    background: #fff; color: #000; font: 12px/1.3 "MS Sans Serif", Tahoma, sans-serif;
  }
  .popup .broken .bic {
    flex: 0 0 auto; width: 20px; height: 20px; border: 1px solid #000;
    background:
      linear-gradient(135deg, transparent 44%, #d02020 44%, #d02020 56%, transparent 56%),
      #fff;
  }
  .popup .broken .balt { color: #000; }

  #hud {
    position: fixed; left: calc(var(--brain-width) + var(--projection-gap) + 24px); top: 16px; z-index: 20;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: rgba(255,255,255,0.55);
    pointer-events: none; user-select:none;
  }
  #hud b {
    display: block; color: rgba(255,255,255,0.95); font-weight: 900;
    font-family: "Bernard MT Condensed", Impact, Haettenschweiler, "Arial Narrow Bold", fantasy;
    font-size: clamp(32px, 3.8vw, 64px); line-height: 0.9; letter-spacing: 0;
    text-shadow: 0 0 12px rgba(255,255,255,0.28);
  }
  #legend { position: fixed; left: calc(var(--brain-width) - 170px); top: 12px; z-index:20;
    font: 11px/1.7 -apple-system, sans-serif; color: rgba(255,255,255,0.7);
    pointer-events:none; user-select:none; text-align:right; }
  #legend .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-left:6px; vertical-align:middle; }

  /* ソース取得・編集への導線（ポップアップより前面に固定） */
  #source { position: fixed; left: 14px; bottom: 12px; z-index: 1000; display: none; gap: 8px;
    pointer-events: auto; font: 12px/1.4 -apple-system, sans-serif; }
  #source a {
    color: rgba(255,255,255,0.82); text-decoration: none;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
    padding: 5px 10px; border-radius: 6px; white-space: nowrap;
  }
  #source a:hover { color: #fff; border-color: rgba(255,255,255,0.65); background: rgba(0,0,0,0.75); }

  .popup.closing {
    animation: popupCollapse 220ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes popupCollapse {
    0% { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); }
    100% { opacity: 0; transform: translateY(4px) scale(0.94); filter: brightness(2.3) blur(2px); }
  }

  #traceLayer {
    position: fixed; inset: 0; pointer-events: none; z-index: 16; overflow: hidden;
    mix-blend-mode: screen;
  }
  .traceLightWrap {
    position: absolute; height: 2px; transform-origin: 0 50%;
  }
  .traceLight {
    display: block; width: 100%; height: 2px; border-radius: 999px;
    background: linear-gradient(90deg, transparent 0%, var(--trace-color) 30%, #fff 58%, transparent 100%);
    box-shadow: 0 0 9px var(--trace-color), 0 0 28px rgba(255,255,255,0.55);
    transform-origin: 0 50%;
    animation: traceBeam 760ms ease-out forwards;
  }
  @keyframes traceBeam {
    0% { opacity: 0; transform: scaleX(0); }
    18% { opacity: 1; transform: scaleX(0.18); }
    82% { opacity: 0.95; transform: scaleX(1); }
    100% { opacity: 0; transform: scaleX(1); }
  }
  .traceSpark {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: var(--trace-color); box-shadow: 0 0 15px var(--trace-color), 0 0 30px #fff;
    animation: sparkFade 900ms ease-out forwards;
  }
  @keyframes sparkFade {
    to { opacity: 0; transform: translate(var(--spark-x), var(--spark-y)) scale(0.25); }
  }

  #figureLayer {
    --motion-color: rgba(255,255,255,0.92);
    position: fixed; right: 0; top: 0; bottom: 0; width: var(--figure-width);
    z-index: 7; pointer-events: none; overflow: hidden; background: #000;
    color: rgba(230,238,255,0.86);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  #figureLayer::before {
    content: ""; position: absolute; left: calc(var(--projection-gap) * -1); top: 0; bottom: 0;
    width: var(--projection-gap); background: #000;
  }
  #projectionText {
    position: absolute; inset: -10vh -8vw; z-index: 1; overflow: hidden;
    color: rgba(255,255,255,0.82);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", "Times New Roman", serif;
    text-shadow: 0 0 8px rgba(255,255,255,0.18), 0 0 20px rgba(0,0,0,0.8);
  }
  .textColumn {
    position: absolute; top: -8vh; height: 116vh;
    writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap;
    font-size: clamp(20px, 2.65vw, 38px); line-height: 1.12; letter-spacing: 0;
    font-weight: 500; opacity: 0.88;
    animation: textColumnDrift var(--text-speed) linear infinite alternate;
  }
  @keyframes textColumnDrift {
    from { transform: translateY(var(--text-start)); }
    to { transform: translateY(var(--text-end)); }
  }
  #humanWall {
    position: absolute; left: 36%; top: 50%; z-index: 3;
    width: min(36%, 260px); height: min(86vh, 720px);
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
  }
  #humanWall::before {
    display: none;
  }
  #humanVideo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; background: #000;
    transition: opacity 420ms ease, filter 650ms ease;
    filter: brightness(1.08) contrast(1.06);
  }
  #humanWall.video-ready #humanVideo { opacity: 1; }
  #humanWall.video-ready #humanFigure { opacity: 0; }
  #humanHalo {
    position: absolute; left: 50%; top: 47%; width: 150%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%; opacity: 0.72; z-index: -1;
    background:
      radial-gradient(circle, color-mix(in srgb, var(--motion-color) 84%, #fff) 0%, transparent 18%),
      conic-gradient(
        from var(--halo-rotation, 0deg),
        color-mix(in srgb, var(--motion-color) 74%, #37f6ff),
        color-mix(in srgb, var(--motion-color) 58%, #ff4bd8),
        color-mix(in srgb, var(--motion-color) 64%, #ffe85b),
        color-mix(in srgb, var(--motion-color) 56%, #53ff80),
        color-mix(in srgb, var(--motion-color) 74%, #37f6ff)
      );
    filter: blur(38px) saturate(1.5);
    mix-blend-mode: screen;
    animation: haloBreath 5.6s ease-in-out infinite, haloSpin 18s linear infinite;
  }
  @keyframes haloBreath {
    0%, 100% { opacity: 0.42; transform: translate(-50%, -50%) scale(0.92); }
    50% { opacity: 0.78; transform: translate(-50%, -50%) scale(1.08); }
  }
  @keyframes haloSpin {
    to { --halo-rotation: 360deg; }
  }
  #humanFigure {
    --figure-blur: 0px; --figure-alpha: 0.92; --figure-tilt: 0deg;
    --walk-speed: 4.6s; --body-sway: 5px; --torso-swing: 1.5deg;
    --head-sway: 3px; --head-turn: 3deg; --head-tilt: 0deg;
    --arm-swing: 12deg; --arm-offset-l: 4deg; --arm-offset-r: -4deg;
    --leg-swing: 11deg; --leg-offset-l: 0deg; --leg-offset-r: 0deg;
    position: relative; width: min(78%, 210px); height: min(96%, 580px); opacity: var(--figure-alpha);
    filter: blur(var(--figure-blur)) contrast(1.02);
    transition: filter 650ms ease, opacity 650ms ease;
    animation: figureWalk var(--walk-speed) ease-in-out infinite;
  }
  #humanFigure span {
    position: absolute; display: block;
    background: #d0d0d0;
    box-shadow: 0 0 18px rgba(255,255,255,0.08);
    transition: background-color 650ms ease, opacity 650ms ease;
  }
  #humanFigure .head {
    left: 70px; top: 6px; width: 72px; height: 88px; border-radius: 47% 48% 44% 50%;
    animation: headMotion var(--walk-speed) ease-in-out infinite;
  }
  #humanFigure .torso {
    left: 54px; top: 82px; width: 104px; height: 232px; border-radius: 44% 48% 34% 38%;
  }
  #humanFigure .arm.l {
    left: 29px; top: 118px; width: 32px; height: 212px; border-radius: 25px;
    transform-origin: 50% 12%; animation: armLeft var(--walk-speed) ease-in-out infinite;
  }
  #humanFigure .arm.r {
    right: 27px; top: 118px; width: 32px; height: 212px; border-radius: 25px;
    transform-origin: 50% 12%; animation: armRight var(--walk-speed) ease-in-out infinite;
  }
  #humanFigure .leg.l {
    left: 64px; top: 296px; width: 36px; height: 268px; border-radius: 27px;
    transform-origin: 50% 8%; animation: legLeft var(--walk-speed) ease-in-out infinite;
  }
  #humanFigure .leg.r {
    right: 62px; top: 296px; width: 36px; height: 268px; border-radius: 27px;
    transform-origin: 50% 8%; animation: legRight var(--walk-speed) ease-in-out infinite;
  }
  @keyframes figureWalk {
    0%, 100% { transform: translateY(calc(var(--body-sway) * -1)) rotate(calc(var(--figure-tilt) - var(--torso-swing))); }
    50% { transform: translateY(var(--body-sway)) rotate(calc(var(--figure-tilt) + var(--torso-swing))); }
  }
  @keyframes headMotion {
    0%, 100% { transform: translateX(calc(var(--head-sway) * -1)) rotate(calc(var(--head-tilt) - var(--head-turn))); }
    50% { transform: translateX(var(--head-sway)) rotate(calc(var(--head-tilt) + var(--head-turn))); }
  }
  @keyframes armLeft {
    0%, 100% { transform: rotate(calc(var(--arm-offset-l) - var(--arm-swing))); }
    50% { transform: rotate(calc(var(--arm-offset-l) + var(--arm-swing))); }
  }
  @keyframes armRight {
    0%, 100% { transform: rotate(calc(var(--arm-offset-r) + var(--arm-swing))); }
    50% { transform: rotate(calc(var(--arm-offset-r) - var(--arm-swing))); }
  }
  @keyframes legLeft {
    0%, 100% { transform: rotate(calc(var(--leg-offset-l) + var(--leg-swing))); }
    50% { transform: rotate(calc(var(--leg-offset-l) - var(--leg-swing))); }
  }
  @keyframes legRight {
    0%, 100% { transform: rotate(calc(var(--leg-offset-r) - var(--leg-swing))); }
    50% { transform: rotate(calc(var(--leg-offset-r) + var(--leg-swing))); }
  }
  #humanFigure.integrating {
    animation: figureWalk var(--walk-speed) ease-in-out infinite, figurePulse 850ms ease-out;
  }
  @keyframes figurePulse {
    0% { filter: blur(var(--figure-blur)) brightness(1); }
    28% { filter: blur(var(--figure-blur)) brightness(1.55); opacity: 1; }
    100% { filter: blur(var(--figure-blur)) brightness(1); }
  }
  #humanFigure.motion-walk { --walk-speed: 4.6s; --body-sway: 5px; --arm-swing: 12deg; --leg-swing: 11deg; --head-turn: 3deg; }
  #humanFigure.motion-visual { --walk-speed: 6.1s; --body-sway: 2px; --arm-swing: 5deg; --leg-swing: 4deg; --head-turn: 13deg; --head-sway: 7px; }
  #humanFigure.motion-auditory { --walk-speed: 5.2s; --body-sway: 3px; --arm-swing: 4deg; --leg-swing: 5deg; --head-tilt: -8deg; --head-turn: 8deg; --arm-offset-r: -26deg; }
  #humanFigure.motion-gustatory { --walk-speed: 6.8s; --body-sway: 2px; --arm-swing: 3deg; --leg-swing: 3deg; --head-turn: 2deg; --arm-offset-l: 18deg; --arm-offset-r: -18deg; }
  #humanFigure.motion-memory { --walk-speed: 4.0s; --body-sway: 7px; --arm-swing: 13deg; --leg-swing: 17deg; --head-turn: 5deg; --torso-swing: 2.3deg; }
  #humanFigure.motion-amygdala { --walk-speed: 2.7s; --body-sway: 9px; --arm-swing: 21deg; --leg-swing: 15deg; --head-turn: 10deg; --torso-swing: 3.4deg; }
  #humanFigure.integrating span { background: color-mix(in srgb, #d0d0d0 72%, var(--motion-color)); }

  #traceVoice {
    display: none;
  }
  #actionText {
    min-height: 1.6em; font-size: 13px; line-height: 1.55; color: rgba(230,238,255,0.72);
  }
  #wordText {
    min-height: 2.8em; margin-top: 6px;
    font-size: clamp(20px, 2.5vw, 34px); line-height: 1.26; font-weight: 600;
    color: rgba(255,255,255,0.92);
  }
  #wordText.flashing { animation: wordArrive 860ms ease-out; }
  @keyframes wordArrive {
    0% { opacity: 0; filter: blur(8px); transform: translateY(12px); }
    35% { opacity: 1; filter: blur(0); transform: translateY(0); color: var(--trace-color); }
    100% { opacity: 1; filter: blur(0); }
  }
  #traceLog { margin-top: 13px; display: flex; flex-direction: column; gap: 4px; }
  .traceEntry {
    font-size: 11px; line-height: 1.35; color: rgba(220,232,255,0.48);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #traceStats {
    position: absolute; right: 22px; top: 96px; z-index: 5;
    width: min(48%, 470px); color: rgba(255,255,255,0.9);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    text-shadow: 0 0 12px rgba(0,0,0,0.9);
  }
  #traceCounter {
    display: grid; grid-template-columns: 1fr; gap: 4px; align-items: baseline;
    font: 13px/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    letter-spacing: 0; text-transform: lowercase;
  }
  #traceCountValue {
    font-family: "Bernard MT Condensed", Impact, Haettenschweiler, "Arial Narrow Bold", fantasy;
    font-size: clamp(58px, 7.4vw, 118px); line-height: 0.82; font-weight: 900;
    color: var(--motion-color); text-shadow: 0 0 18px var(--motion-color);
  }
  #traceFormula {
    margin-top: 14px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--motion-color) 55%, transparent);
    font-family: "Cambria Math", "STIX Two Math", "Times New Roman", "Yu Mincho", serif;
    font-size: clamp(28px, 3vw, 50px); line-height: 1.28; color: var(--motion-color);
  }
  .mathExpr {
    display: block; white-space: nowrap; letter-spacing: 0;
    text-shadow: 0 0 14px currentColor;
  }
  .mathExpr .mi { font-style: italic; }
  .mathExpr .op { display: inline-block; padding: 0 0.08em; }
  .mathExpr .int {
    display: inline-block; font-size: 1.85em; line-height: 0; vertical-align: -0.18em;
    margin: 0 0.03em;
  }
  .mathExpr sup, .mathExpr sub {
    font-size: 0.58em; line-height: 0; position: relative;
  }
  .mathExpr sup { top: -0.52em; }
  .mathExpr sub { bottom: -0.12em; }
  .mathMeta {
    display: block; margin-top: 5px;
    font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color: rgba(255,255,255,0.58); text-shadow: none;
  }
  #traceDistribution {
    display: block; width: 100%; height: 118px; margin-top: 12px;
    border: 1px solid color-mix(in srgb, var(--motion-color) 52%, transparent);
    background: rgba(0,0,0,0.64);
    box-shadow: inset 0 0 24px rgba(255,255,255,0.05), 0 0 20px rgba(0,0,0,0.9);
  }
  #terminalOutput {
    position: absolute; right: 22px; bottom: 24px; z-index: 5;
    width: min(43%, 390px); padding: 14px 16px;
    height: 112px; box-sizing: border-box; overflow: hidden;
    border: 1px solid rgba(120,240,255,0.55);
    background: rgba(0,0,0,0.84);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.9), 0 0 30px rgba(0,210,255,0.16);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color: rgba(220,255,238,0.92); letter-spacing: 0;
  }
  .terminalLine {
    white-space: pre-wrap; word-break: break-word; opacity: 0.82;
    text-shadow: 0 0 8px currentColor;
  }
  .terminalLine.hot { color: var(--motion-color); opacity: 1; }

  @media (max-width: 760px) {
    :root { --brain-width: 100vw; --figure-width: 100vw; --projection-gap: 0px; }
    #glcanvas { width: 100vw; height: 52vh; }
    #popupLayer { width: 100vw; height: 52vh; bottom: auto; }
    #figureLayer { left: 0; right: 0; top: 52vh; bottom: 0; width: 100vw; height: 48vh; }
    .textColumn { font-size: clamp(22px, 8vw, 36px); line-height: 1.08; opacity: 0.74; }
    #humanWall { left: 34%; top: 45%; width: 36%; height: 78%; transform: translate(-50%, -50%) scale(0.78); }
    #traceVoice { left: 16px; right: 16px; bottom: 12px; width: auto; min-width: 0; text-align: left; transform: none; }
    #traceStats { right: 12px; top: 12px; width: 48%; }
    #traceFormula { font-size: 22px; }
    #traceDistribution { height: 76px; }
    #terminalOutput { right: 12px; bottom: 12px; width: 46%; height: 86px; font-size: 10px; padding: 10px; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="popupLayer"></div>
<div id="traceLayer"></div>
<div id="figureLayer" aria-hidden="true">
  <div id="projectionText"></div>
  <div id="humanWall">
    <div id="humanHalo"></div>
    <video id="humanVideo" muted playsinline loop preload="auto"></video>
    <div id="humanFigure" class="motion-walk">
      <span class="head"></span>
      <span class="torso"></span>
      <span class="arm l"></span>
      <span class="arm r"></span>
      <span class="leg l"></span>
      <span class="leg r"></span>
    </div>
  </div>
  <div id="traceVoice">
    <div id="actionText">輪郭だけが、まだ誰でもないまま呼吸している。</div>
    <div id="wordText">「まだ定義されていない」</div>
    <div id="traceLog"></div>
  </div>
  <div id="traceStats">
    <div id="traceCounter">
      <span>total traces integrated</span>
      <span id="traceCountValue">0</span>
    </div>
    <div id="traceFormula"></div>
    <canvas id="traceDistribution"></canvas>
  </div>
  <div id="terminalOutput" aria-hidden="true"></div>
</div>
<div id="hud">
  <b>Ill-defined self</b><br>Local projection generated.<br>Projection faded. Trace remains.
</div>
<div id="legend"></div>
<div id="source">
  <a href="https://github.com/kisa-expr/media-art1" target="_blank" rel="noopener">&lt;/&gt; source</a>
  <a href="https://github.dev/kisa-expr/media-art1" target="_blank" rel="noopener">edit</a>
</div>

<!-- Three.js r128 + GLTFLoader (local, classic scripts) -->
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>

<script>
/* ============================================================
   調整可能な設定（ここをまとめて編集できます）
   ============================================================ */

// 脳メッシュの .gltf / .glb パス。ファイルが無ければ自動でプレースホルダ脳を生成します。
const BRAIN_MODEL_PATH = "brain_areas/scene.gltf";
const BRAIN_OPACITY    = 0.18;   // 脳サーフェスの不透明度 (0.15〜0.25)

function getBrainSize() {

  return { width: Math.max(1, rect.width), height: Math.max(1, rect.height) };

const cam = { theta: 0.6, phi: 1.3, radius: 6.0, target: new THREE.Vector3(0,-0.3,0) };
let dragging = false, lastX = 0, lastY = 0, lastInteract = 0;

function updateCamera() {
  const r = cam.radius, p = cam.phi, t = cam.theta;
  camera.position.set(
    cam.target.x + r * Math.sin(p) * Math.sin(t),
    cam.target.y + r * Math.cos(p),
    cam.target.z + r * Math.sin(p) * Math.cos(t)
  );
  camera.lookAt(cam.target);
}
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; lastInteract = performance.now(); });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (dragging) {
    cam.theta -= (e.clientX - lastX) * 0.005;
    cam.phi   -= (e.clientY - lastY) * 0.005;
    cam.phi = Math.max(0.15, Math.min(Math.PI - 0.15, cam.phi));
    lastX = e.clientX; lastY = e.clientY;
    lastInteract = performance.now();
  }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.radius = Math.max(3.5, Math.min(18, cam.radius + e.deltaY * 0.01));
  lastInteract = performance.now();
}, { passive: false });

function addBrainMaterialTo(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.material = new THREE.MeshPhongMaterial({
        color: 0x9fb8ff, transparent: true, opacity: BRAIN_OPACITY,
        shininess: 30, depthWrite: false, side: THREE.DoubleSide,
      });
    }
  });
}

function makeProceduralBrain() {
  // .gltf が無い場合のフォールバック：ノイズ変形した楕円体で脳っぽい塊を作る
  const geo = new THREE.IcosahedronGeometry(1.9, 5);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = 0.14 * Math.sin(v.x*5.0) * Math.sin(v.y*4.0)
            + 0.10 * Math.sin(v.z*6.0 + v.x*3.0)
            + 0.06 * Math.sin(v.y*9.0 + v.z*5.0);
    const fissure = 0.16 * Math.exp(-Math.pow(v.x*3.0, 2)); // 中央の溝
    v.multiplyScalar(1 + n);
    v.x *= 1.02; v.y *= 0.92; v.z *= 1.28; // 前後に長い脳の形
    v.y -= fissure * Math.max(0, v.y);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const g = new THREE.Group();
  const surf = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
    color: 0x9fb8ff, transparent: true, opacity: BRAIN_OPACITY,
    shininess: 30, depthWrite: false, side: THREE.DoubleSide,
  }));
  const wire = new THREE.LineSegments(
    new THREE.WireframeGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x6f8fff, transparent: true, opacity: 0.06 })
  );
  g.add(surf); g.add(wire);
  return g;
}

function loadBrain() {
  if (typeof THREE.GLTFLoader === 'function') {
    const loader = new THREE.GLTFLoader();
    loader.load(
      BRAIN_MODEL_PATH,
      gltf => {
        const model = gltf.scene;
        addBrainMaterialTo(model);
        // 正規化してrootGroupの中央に
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const scale = BRAIN_TARGET_SIZE / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        rootGroup.add(model);
        console.log('Brain GLTF loaded:', BRAIN_MODEL_PATH);
      },
      undefined,
      err => {
        console.warn('GLTF読み込み失敗 → プレースホルダ脳を使用:', BRAIN_MODEL_PATH);
        rootGroup.add(makeProceduralBrain());
      }
    );
  } else {
    console.warn('GLTFLoader未読込 → プレースホルダ脳を使用');
    rootGroup.add(makeProceduralBrain());
  }
}

// 中央寄りの分布（-1〜+1、ガウス風）
function gaussish() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }

// 発光用のソフトな円形テクスチャ（ノードのハロー＆粒子で共用）
const GLOW_TEX = (function () {
  const s = 64, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.28, 'rgba(255,255,255,0.7)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.22)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
})();

const nodeGeo = new THREE.SphereGeometry(0.05, 16, 16);  // 明るいコア球
const hitGeo  = new THREE.SphereGeometry(0.26, 8, 8);    // ホバー用の当たり判定（不可視・やや大きめ）

NODE_TYPES.forEach(tp => {
  const c = new THREE.Color(tp.color);
  nodeMap[tp.key] = { def: tp };
  const coreMat = new THREE.MeshBasicMaterial({ color: c });
  const haloMat = new THREE.SpriteMaterial({
    map: GLOW_TEX, color: c, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  for (let i = 0; i < tp.count; i++) {
    const pos = new THREE.Vector3(
      tp.center[0] + gaussish() * tp.spread,
      tp.center[1] + gaussish() * tp.spread * 0.9,
      tp.center[2] + gaussish() * tp.spread
    );
    const dot = new THREE.Mesh(nodeGeo, coreMat);   // 明るいコア
    dot.position.copy(pos);
    rootGroup.add(dot);

    const halo = new THREE.Sprite(haloMat);          // 静的なグロー（明滅なし）
    halo.position.copy(pos);
    halo.scale.setScalar(0.42);
    rootGroup.add(halo);

    const hit = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ visible: false }));
    hit.position.copy(pos);
    hit.userData.nodeKey = tp.key;
    rootGroup.add(hit);
    nodeMeshes.push(hit);

    nodeInstances.push({ typeKey: tp.key, color: c, pos });
  }
});

// ============================================================
const SAMPLES = 48; // 各粒子の経路サンプル点数
const tmpV = new THREE.Vector3();

function buildCurveSamples(a, b) {
  // start→end 間に、法線方向へランダムに膨らむ制御点を持つCatmull-Rom曲線（a,b は Vector3）
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const perp1 = new THREE.Vector3(-dir.y, dir.x, 0).normalize();
  if (perp1.lengthSq() < 0.001) perp1.set(1,0,0);
  const perp2 = new THREE.Vector3().crossVectors(dir, perp1).normalize();

  function ctrl(t) {
    const base = new THREE.Vector3().lerpVectors(a, b, t);
    const amp = ARC_JITTER * len * 0.28 * Math.sin(Math.PI * t); // 端で0、中央で最大
    base.addScaledVector(perp1, (Math.random()*2-1) * amp);
    base.addScaledVector(perp2, (Math.random()*2-1) * amp);
    return base;
  }
  const curve = new THREE.CatmullRomCurve3([a.clone(), ctrl(0.33), ctrl(0.66), b.clone()]);
  return curve.getPoints(SAMPLES - 1); // 配列長 SAMPLES
}

const particles = [];
const ENDPOINT_JITTER = 0.35; // 端点をこの範囲でばらつかせ、ノードで一点集束＝発光しないようにする
function randInstance() { return nodeInstances[(Math.random() * nodeInstances.length) | 0]; }
function jittered(pos) {
  return new THREE.Vector3(
    pos.x + (Math.random() * 2 - 1) * ENDPOINT_JITTER,
    pos.y + (Math.random() * 2 - 1) * ENDPOINT_JITTER,
    pos.z + (Math.random() * 2 - 1) * ENDPOINT_JITTER
  );
}
function spawnParticle(p) {
  // 出発は任意のノード。到着は約55%の確率でハブ（海馬/扁桃体）へ集束させ、求心/遠心の流れを作る
  const from = randInstance();
  let to = (Math.random() < 0.55 && hubInstances.length)
    ? hubInstances[(Math.random() * hubInstances.length) | 0]
    : randInstance();
  if (to === from) to = randInstance();
  p.samples = buildCurveSamples(jittered(from.pos), jittered(to.pos)); // 端点を散らした経路
  p.color = from.color;                            // 出発ノードのタイプ色
  p.t = 0;
  p.speed = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
  return p;
}
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(spawnParticle({}));
  // 初期位相をばらす
  particles[i].t = Math.random();
}

const totalPts = PARTICLE_COUNT * TAIL;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(totalPts * 3);
const pCol = new Float32Array(totalPts * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pMat = new THREE.PointsMaterial({
  size: PARTICLE_SIZE, vertexColors: true, transparent: true, opacity: 0.95,
  map: GLOW_TEX, blending: THREE.AdditiveBlending,
  depthWrite: false, sizeAttenuation: true,
});
const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
rootGroup.add(points);

function sampleAt(samples, t) {
  // t:0..1 → サンプル配列を線形補間
  if (t <= 0) return samples[0];
  if (t >= 1) return samples[samples.length - 1];
  const f = t * (samples.length - 1);
  const i = f | 0;
  const frac = f - i;
  return tmpV.lerpVectors(samples[i], samples[i+1], frac);
}

const TAIL_GAP = 0.045; // 尾の点どうしのt間隔

function updateParticles(dt) {
  let idx = 0;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.t += p.speed * dt;
    if (p.t >= 1) spawnParticle(p);

    const cr = p.color.r, cg = p.color.g, cb = p.color.b;
    for (let k = 0; k < TAIL; k++) {
      const tt = p.t - k * TAIL_GAP;
      const v = sampleAt(p.samples, tt);
      const o = idx * 3;
      pPos[o] = v.x; pPos[o+1] = v.y; pPos[o+2] = v.z;
      const b = (1 - k / TAIL); // 先頭ほど明るい
      pCol[o] = cr * b; pCol[o+1] = cg * b; pCol[o+2] = cb * b;
      idx++;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

let hoverKey = null;

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
    mouse.set(-2, -2);
    mousePX = -9999; mousePY = -9999;
    return;
  }
  mouse.x = (x / rect.width) * 2 - 1;
  mouse.y = -(y / rect.height) * 2 + 1;
  mousePX = e.clientX; mousePY = e.clientY;
});
canvas.addEventListener('mouseleave', () => { mouse.set(-2, -2); mousePX = -9999; mousePY = -9999; });

function updateHover() {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes, false);
  const key = hits.length ? hits[0].object.userData.nodeKey : null;
  if (key !== hoverKey) {
    hoverKey = key;
    onHoverChange(key);
  }
}

function drawTraceDistribution() {
  if (!traceDistributionCtx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = traceDistribution.getBoundingClientRect();
  const w = Math.max(1, Math.floor(rect.width * dpr));
  const h = Math.max(1, Math.floor(rect.height * dpr));
  if (traceDistribution.width !== w || traceDistribution.height !== h) {
    traceDistribution.width = w;
    traceDistribution.height = h;
  }
  const ctx = traceDistributionCtx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cw = rect.width, ch = rect.height;
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, cw, ch);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = ch * i / 4;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
  }
  const maxV = Math.max(1, ...traceHistory.flatMap(frame => NODE_TYPES.map(tp => frame[tp.key] || 0)));
  NODE_TYPES.forEach(tp => {
    const c = new THREE.Color(tp.color);
    ctx.strokeStyle = '#' + c.getHexString();
    ctx.lineWidth = tp.key === currentSpeechNode ? 2.4 : 1.35;
    ctx.beginPath();
    traceHistory.forEach((frame, i) => {
      const x = traceHistory.length <= 1 ? 0 : (i / (traceHistory.length - 1)) * cw;
      const y = ch - ((frame[tp.key] || 0) / maxV) * (ch - 12) - 6;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
}

function updateTraceDistribution(dt) {
  const decay = Math.exp(-dt / TRACE_TAU);
  contaminationChaos = Math.max(0, contaminationChaos - dt * 0.72);
  NODE_TYPES.forEach(tp => {
    traceActivity[tp.key] *= decay;
    traceActivity[tp.key] = Math.max(0.001, traceActivity[tp.key]);
    traceActivity[tp.key] *= 1 + (0.18 + Math.random() * 0.72) * dt;
    if (contaminationChaos > 0) {
      traceActivity[tp.key] *= Math.max(0.08, 1 + (Math.random() * 2 - 1) * contaminationChaos * dt * 4.8);
      traceActivity[tp.key] = Math.max(0.001, traceActivity[tp.key]);
    }
  });
  traceDistributionClock += dt;
  if (traceDistributionClock >= 0.08) {
    traceDistributionClock = 0;
    const frame = {};
    const total = NODE_TYPES.reduce((sum, tp) => sum + traceActivity[tp.key], 0) || 1;
    NODE_TYPES.forEach(tp => { frame[tp.key] = traceActivity[tp.key] / total; });
    traceHistory.push(frame);
    while (traceHistory.length > 120) traceHistory.shift();
    drawTraceDistribution();
  }
}

// 全ノードの画面座標を毎回計算（カーソル＋ノードを避けるため）
const _proj = new THREE.Vector3();
let nodeScreen = [];
function getPopupAreaSize() {
  return {
    W: Math.max(1, popupLayer.clientWidth || getBrainSize().width),
    H: Math.max(1, popupLayer.clientHeight || getBrainSize().height)

function updateNodeScreen() {

// その矩形がカーソルとノードを避けているか
function isClear(x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2;
  const { W, H } = getPopupAreaSize();
  // 画面中央（脳のあたり）は常に空ける
  const ex = (cx - W / 2)  / (W * CENTER_CLEAR_W);
  const ey = (cy - H / 2) / (H * CENTER_CLEAR_H);
  if (ex * ex + ey * ey < 1) return false;
  if (Math.hypot(cx - mousePX, cy - mousePY) < CURSOR_AVOID_RADIUS) return false;
  for (const n of nodeScreen) if (Math.hypot(cx - n.x, cy - n.y) < NODE_AVOID_RADIUS) return false;
  return true;
}
// 周囲（周辺リング）だけに出す出現位置。中央/カーソル/ノードは常に避ける
let fillAngle = Math.random() * Math.PI * 2;
function edgeInwardPos(w, h) {
  updateNodeScreen();
  const { W, H } = getPopupAreaSize();
  const cx = W / 2, cy = H / 2;
  const maxR = Math.hypot(cx, cy);
  for (let i = 0; i < 80; i++) {
    fillAngle += 2.399963;                       // 黄金角で角度を回し、全周に散らす
    const r = maxR * (0.42 + Math.random() * 0.56); // 中央には来ない周辺リング
    let x = cx + Math.cos(fillAngle) * r - w / 2;
    let y = cy + Math.sin(fillAngle) * r * 0.92 - h / 2;
    x = Math.max(-w * 0.25, Math.min(W - w * 0.75, x));
    y = Math.max(-h * 0.10, Math.min(H - h * 0.75, y));
    if (isClear(x, y, w, h)) return { x, y };   // 中央・カーソル・ノードを避けた位置のみ採用
  }
  // フォールバック：四隅のうちカーソルから最も遠い角（必ず中央の外）
  const corners = [[8, 8], [W - w - 8, 8], [8, H - h - 8], [W - w - 8, H - h - 8]];
  let best = corners[0], bd = -1;
  for (const c of corners) {
    const d = Math.hypot(c[0] + w / 2 - mousePX, c[1] + h / 2 - mousePY);
    if (d > bd) { bd = d; best = c; }
  }
  return { x: best[0], y: best[1] };
}

// ---- 出現パターン（ただのランダムではなく、束や連なりで出す） ----
// cascade=斜めに重なって連なる / row=横に連続 / triple=三つを密に重ねる
let cluster = null;
function newCluster() {
  // 半分は単発ランダム(single)、残りは重なり束(cascade/row/triple)を混在させる
  let mode;
  if (Math.random() < SINGLE_RATIO) mode = 'single';
  else mode = ['cascade', 'row', 'triple', 'row'][(Math.random() * 4) | 0];
  // サイズ帯（大小を混在させる）
  const r = Math.random();
  let w = r < 0.42 ? (135 + Math.random() * 55)      // 小
        : r < 0.80 ? (205 + Math.random() * 70)      // 中
        :            (295 + Math.random() * 70);      // 大
  const h = Math.round(w * (0.72 + Math.random() * 0.3));
  let dx, dy, count;
  if (mode === 'single')       { dx = 0;  dy = 0;  count = 1; }
  else if (mode === 'cascade') { dx = 22; dy = 20; count = 3 + (Math.random() * 3 | 0); }
  else if (mode === 'row')     { dx = w * (0.5 + Math.random() * 0.28); dy = (Math.random() * 2 - 1) * 12; count = 3 + (Math.random() * 3 | 0); }
  else                         { dx = 11; dy = 9;  count = 3; } // triple
  // 束全体がカーソル・ノードを避け、外側→内側の流れで収まる開始位置
  const spanX = Math.abs(dx) * (count - 1) + w;
  const spanY = Math.abs(dy) * (count - 1) + h + 40;
  const anchor = edgeInwardPos(spanX, spanY);
  return { w, h, dx, dy, remaining: count, x: anchor.x, y: anchor.y };
}
function nextPlacement() {
  if (!cluster || cluster.remaining <= 0) cluster = newCluster();
  const sw = Math.round(cluster.w * (0.9 + Math.random() * 0.2));
  const sh = Math.round(cluster.h * (0.9 + Math.random() * 0.2));
  // 少し(-30%まで)はみ出しを許しつつ、大半が画面に残るようクランプ
  const { W, H } = getPopupAreaSize();
  let x = Math.max(-sw * 0.28, Math.min(W - sw * 0.72, cluster.x));
  let y = Math.max(-sh * 0.10, Math.min(H - sh * 0.72, cluster.y));
  cluster.x += cluster.dx; cluster.y += cluster.dy;
  cluster.remaining--;
  // 束が中央/カーソル/ノードに入り込む位置になったら、その束は打ち切り外周へ取り直す
  if (!isClear(x, y, sw, sh)) {
    const a = edgeInwardPos(sw, sh);
    x = a.x; y = a.y; cluster.remaining = 0;
  }
  return { x: Math.round(x), y: Math.round(y), w: sw, h: sh };
}

  });
}

function setHumanMotion(nodeKey, color) {
  const library = TRACE_LIBRARY[nodeKey] || TRACE_LIBRARY.default;
  const motion = RND(library.poses);
  humanFigure.classList.remove(...MOTION_CLASSES);
  humanFigure.classList.add(motion);
  humanFigure.style.setProperty('--motion-color', color || '#d0d0d0');
  figureLayer.style.setProperty('--motion-color', color || '#d0d0d0');
  humanFigure.dataset.motionSource = nodeKey || 'default';
  refreshProjectionText(nodeKey || 'default');
  setHumanVideo(nodeKey || 'default');
  return motion;
}
setHumanVideo('default');

function integrateTrace(rec) {
  const color = rec.color || '#ffffff';
  const library = TRACE_LIBRARY[rec.nodeKey] || TRACE_LIBRARY.default;
  const action = RND(library.actions);
  const word = RND(library.words);
  integratedTraceCount++;

  setHumanMotion(rec.nodeKey, color);
  addTraceActivation(rec.nodeKey, color);
  updateTraceCounter(0.016);
  pushTerminalLine(true);
  humanFigure.classList.add('integrating');
  humanFigure.style.setProperty('--figure-blur', '0px');
  humanFigure.style.setProperty('--figure-alpha', Math.min(0.97, 0.92 + integratedTraceCount * 0.002).toFixed(2));
  humanFigure.style.setProperty('--figure-tilt', ((Math.random() * 2 - 1) * Math.min(4, 1 + integratedTraceCount * 0.05)).toFixed(2) + 'deg');

  actionText.textContent = action;
  wordText.textContent = `「${word}」`;
  wordText.style.setProperty('--trace-color', color);
  wordText.classList.remove('flashing');
  void wordText.offsetWidth;
  wordText.classList.add('flashing');
  setTimeout(() => humanFigure.classList.remove('integrating'), 880);

  addTraceEntry(action, word, color);
  speakTrace(word);
}

function emitTraceFromPopup(rect, rec) {
  if (!traceLayer || !humanFigure || !rect) return;
  const color = rec.color || '#ffffff';
  const startX = rect.left + rect.width / 2;
  const startY = rect.top + rect.height / 2;
  const target = getFigureAnchor();
  const dx = target.x - startX;
  const dy = target.y - startY;
  const len = Math.max(12, Math.hypot(dx, dy));
  const angle = Math.atan2(dy, dx);

  const wrap = document.createElement('div');
  wrap.className = 'traceLightWrap';
  wrap.style.left = startX + 'px';
  wrap.style.top = startY + 'px';
  wrap.style.width = len + 'px';
  wrap.style.transform = `rotate(${angle}rad)`;
  wrap.style.setProperty('--trace-color', color);

  const beam = document.createElement('span');
  beam.className = 'traceLight';
  wrap.appendChild(beam);
  traceLayer.appendChild(wrap);
  updateTraceFormula(color, rec.nodeKey);

  setTimeout(() => {
    spawnResidualSparks(target.x, target.y, color);
    integrateTrace(rec);
  }, 680);
  setTimeout(() => wrap.remove(), 1200);
}

function spawnPopup(node) {
  if (activePopups.length >= MAX_POPUPS) removePopup(activePopups[0]);

  const pl = nextPlacement();
  const { content, srcText, srcKind } = makePopupBody(node);
  const base = srcText.split(/[\\/]/).pop() || srcText; // ファイル名（タイトルバー用）

  const el = document.createElement('div');
  el.className = 'popup';
  el.style.width = pl.w + 'px';
  el.style.left  = pl.x + 'px';
  el.style.top   = pl.y + 'px';
  el.style.zIndex = String(11 + (spawnSeq++ % 500));

  // レトロなタイトルバー（ファイル名＋最小化/最大化/閉じるボタン）
  const titlebar = document.createElement('div');
  titlebar.className = 'titlebar';
  titlebar.innerHTML =
    `<span class="tico"></span><span class="ttext"></span>` +
    `<span class="tbtn">_</span><span class="tbtn">□</span><span class="tbtn">×</span>`;
  titlebar.querySelector('.ttext').textContent = base;

  // アドレス欄＝貼り付けた画像のソース（web の URL / PC のパス）
  const srcbar = document.createElement('div');
  srcbar.className = 'srcbar ' + srcKind;
  srcbar.textContent = srcText;

  const body = document.createElement('div');
  body.className = 'body';
  body.style.height = Math.max(38, pl.h - 44) + 'px';
  body.appendChild(content);

  el.appendChild(titlebar);
  el.appendChild(srcbar);
  el.appendChild(body);
  popupLayer.appendChild(el);
  activePopups.push({
    el,
    nodeKey: node.key,
    color: '#' + new THREE.Color(node.color).getHexString(),
    source: srcText
  });
}

function removePopup(rec) {
  if (!rec || rec.closing) return;
  rec.closing = true;
  const i = activePopups.indexOf(rec);
  if (i >= 0) activePopups.splice(i, 1);
  const rect = rec.el ? rec.el.getBoundingClientRect() : null;
  if (rec.el) rec.el.classList.add('closing');
  setTimeout(() => {
    if (rec.el && rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
    emitTraceFromPopup(rect, rec);
  }, 230);
}

function startAudio(node) {
  stopAudio();
  const src = pickAudio(node);
  if (!src) return;
  currentAudio = new Audio(src);
  currentAudio.loop = true;
  currentAudio.volume = 0.7;
  currentAudio.play().catch(()=>{}); // 自動再生ブロック時は無音で続行
}
function stopAudio() {
  if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }
}

function onHoverChange(key) {
  if (key) {
    // ノードに乗った：消去中なら止め、増殖を開始
    if (removeTimer) { clearInterval(removeTimer); removeTimer = null; }
    if (spawnTimer) clearInterval(spawnTimer);
    cluster = null; // 新しいホバーごとに束を仕切り直す
    const node = nodeMap[key].def;
    setHumanMotion(key, '#' + new THREE.Color(node.color).getHexString());
    spawnPopup(node);
    spawnTimer = setInterval(() => spawnPopup(node), POPUP_INTERVAL);
    startAudio(node);
    document.body.style.cursor = 'pointer';
  } else {
    // ノードから外れた：増殖を止め、古いものから1枚ずつ消す（フェードなし）
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
    stopAudio();
    document.body.style.cursor = 'default';
    if (!removeTimer) {
      removeTimer = setInterval(() => {
        if (activePopups.length === 0) { clearInterval(removeTimer); removeTimer = null; return; }
        removePopup(activePopups[0]); // 先頭 = 最も古い
      }, POPUP_REMOVE_INTERVAL);
    }
  }
}

// ============================================================
// アニメーションループ
// ============================================================
let prev = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;

  // 自動回転（デフォルト off。ドラッグ／操作の直後は止める）
  if (AUTO_ROTATE && !dragging && now - lastInteract > 400) {
    cam.theta += AUTO_ROTATE_SPEED * dt;
  }
  updateCamera();

  updateParticles(dt);
  updateHover();
  updateTraceCounter(dt);
  updateTraceDistribution(dt);
  fadeTraceReadoutToWhite(now);

  renderer.render(scene, camera);
}
updateCamera();
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  resizeBrainRenderer();
});
</script>
